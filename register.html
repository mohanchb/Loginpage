<!DOCTYPE html>
<html>
<head>
    <title>Register Page</title>

    <style>
        body{
            font-family: Arial;
            background-color: #e6f2ff;
        }

        .container{
            width: 350px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2{
            text-align: center;
        }

        input{
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button{
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: green;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Register</h2>

        <form>
            <input type="text" placeholder="Enter Name">
            <input type="email" placeholder="Enter Email">
            <input type="password" placeholder="Enter Password">
            <input type="password" placeholder="Confirm Password">

            <button type="submit">Register</button>
        </form>
    </div>

</body>
</html>
