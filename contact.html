<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>

    <style>
        body{
            font-family: Arial;
            background-color: #f9f9f9;
        }

        .container{
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2{
            text-align: center;
        }

        input, textarea{
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button{
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: orange;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Contact Us</h2>

        <form>
            <input type="text" placeholder="Enter Your Name">
            <input type="email" placeholder="Enter Your Email">

            <textarea rows="5" placeholder="Enter Message"></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>

</body>
</html>
