<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body{
            font-family: Arial;
            background-color: #f0f0f0;
        }

        .container{
            width: 300px;
            margin: 100px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2{
            text-align: center;
        }

        input{
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button{
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: blue;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Login</h2>

        <form>
            <input type="text" placeholder="Enter Username">
            <input type="password" placeholder="Enter Password">

            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
